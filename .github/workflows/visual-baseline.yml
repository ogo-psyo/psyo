name: Visual baseline

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Commit containing the application to capture
        required: true
        default: dd541d0

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture baseline application with current harness
        run: npm run qa:visual:baseline
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
      - uses: actions/upload-artifact@v6
        with:
          name: psyo-visual-baseline-${{ inputs.baseline_sha }}
          path: scripts/qa/visual-baselines/${{ inputs.baseline_sha }}
          retention-days: 90
