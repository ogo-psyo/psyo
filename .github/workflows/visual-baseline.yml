name: Visual Baseline

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Baseline SHA to capture
        required: true
        default: dd541d0

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture baseline
        run: BASELINE_SHA="${{ inputs.baseline_sha }}" npm run qa:visual:baseline

      - name: Upload visual baseline artifact
        uses: actions/upload-artifact@v6
        with:
          name: visual-baseline-${{ inputs.baseline_sha }}
          path: scripts/qa/visual-baselines/${{ inputs.baseline_sha }}
